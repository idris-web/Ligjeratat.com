<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ligjeratat - Orari i Mësimeve të Imamëve</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <h1 class="logo">Ligjeratat</h1>
            <p class="tagline">Orari i Mësimeve të Imamëve në Kosovë</p>
        </div>
    </header>

    <!-- Filters -->
    <section class="filters">
        <div class="container">
            <div class="filter-group">
                <input type="text" id="filter-imam" class="filter-select" placeholder="Kërko Hoxhën...">

                <select id="filter-city" class="filter-select">
                    <option value="">Të gjitha Qytetet</option>
                </select>

                <select id="sort-by" class="filter-select">
                    <option value="name">Rendit sipas Emrit</option>
                    <option value="city">Rendit sipas Qytetit</option>
                    <option value="schedules">Rendit sipas Mësimeve</option>
                </select>
            </div>

            <div class="filter-toggle-group">
                <label class="filter-toggle">
                    <input type="checkbox" id="only-with-schedules">
                    <span class="toggle-text">Vetëm Hoxha me Mësime</span>
                </label>
            </div>
        </div>
    </section>

    <!-- Main Content -->
    <main class="main">
        <div class="container">
            <div id="schedule-list" class="schedule-grid">
                <!-- Schedule cards will be inserted here -->
            </div>

            <div id="no-results" class="no-results" style="display: none;">
                <p>Nuk ka mësime që përputhen me filtrat e zgjedhur.</p>
            </div>
        </div>
    </main>

    <!-- Detail Modal -->
    <div id="detail-modal" class="modal">
        <div class="modal-content">
            <button class="modal-close" id="modal-close">&times;</button>
            <div id="modal-body">
                <!-- Detail content will be inserted here -->
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <nav class="footer-nav">
                <a href="#" class="footer-link active">Orari</a>
                <a href="#about" class="footer-link">Rreth Platformës</a>
            </nav>
            <p class="footer-text">© 2025 Ligjeratat.com - Orari i Mësimeve të Imamëve</p>
        </div>
    </footer>

    <script src="app.js"></script>
</body>
</html>
